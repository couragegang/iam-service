micronaut:
  application:
    name: iam-service
  server:
    context-path: /v1/iam
  metrics:
    enabled: true
    export:
      prometheus:
        enabled: true
        descriptions: true
    binders:
      jvm:
        enabled: true
      web:
        enabled: true
        server:
          percentiles: [0.5, 0.95, 0.99]
          histogram: true
      uptime:
        enabled: true
      jdbc:
        enabled: true
      processor:
        enabled: true

endpoints:
  health:
    enabled: true
    sensitive: false
  # Стандартный /metrics в Micronaut — список имён метрик; для Prometheus отдаём scrape на /metrics.
  metrics:
    enabled: false
  prometheus:
    enabled: true
    sensitive: false
    path: metrics

datasources:
  default:
    # В docker-compose хост БД — сервис postgres, порт 5432 внутри сети compose.
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:iam}
    username: ${DB_USER:iam}
    password: ${DB_PASSWORD:iam}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

flyway:
  datasources:
    default:
      enabled: true

logger:
  levels:
    org.flywaydb: INFO

iam:
  config-service:
    enabled: ${CONFIG_SERVICE_ENABLED:true}
    base-url: ${CONFIG_SERVICE_URL:http://localhost:8084/v1/config}
    internal-api-key: ${CONFIG_INTERNAL_API_KEY:dev-internal-key}
  jwt-secret: ${JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
  jwt-access-ttl-seconds: 900
  refresh-ttl-seconds: 2592000
  oidc-google-client-id: ${OIDC_GOOGLE_CLIENT_ID:}
  oidc-google-client-secret: ${OIDC_GOOGLE_CLIENT_SECRET:}
  oidc-google-redirect-uri: ${OIDC_GOOGLE_REDIRECT_URI:}
  oidc-github-client-id: ${OIDC_GITHUB_CLIENT_ID:}
  oidc-github-client-secret: ${OIDC_GITHUB_CLIENT_SECRET:}
  oidc-github-redirect-uri: ${OIDC_GITHUB_REDIRECT_URI:}
