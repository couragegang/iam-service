# Запуск: из каталога services/iam-service
#   docker compose up --build
# Сервис iam ждёт healthy postgres; БД снаружи на localhost:5433 (по желанию отключите mapping).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      POSTGRES_DB: iam
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam"]
      interval: 3s
      timeout: 3s
      retries: 10

  iam:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: iam
      DB_USER: iam
      DB_PASSWORD: iam
    depends_on:
      postgres:
        condition: service_healthy
