# Пример scrape для IAM (Micronaut Prometheus на /v1/iam/prometheus).
# Полный стек (Grafana + Prometheus test/prod): platform/deploy/observability/
#
# Важно: label job должен совпадать с выбором в Grafana-дашборде
# (platform/deploy/observability/grafana/dashboards/iam-service-dashboard.json).

scrape_configs:
  - job_name: iam-service
    metrics_path: /v1/iam/prometheus
    scrape_interval: 15s
    static_configs:
      - targets: ["localhost:8080"]
        labels:
          service: iam
